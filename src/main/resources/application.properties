spring.application.name=api-gateway

server.port=8083

gateway.services.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8081}
gateway.services.event-service-url=${EVENT_SERVICE_URL:http://localhost:8080}
gateway.services.registration-service-url=${REGISTRATION_SERVICE_URL:http://localhost:8082}
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.level.org.springframework.cloud.gateway=INFO
