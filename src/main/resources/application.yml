spring:
  application:
    name: api-gateway

server:
  port: 8083

gateway:
  services:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    event-service-url: ${EVENT_SERVICE_URL:http://localhost:8080}
    registration-service-url: ${REGISTRATION_SERVICE_URL:http://localhost:8082}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:*}"

logging:
  level:
    org.springframework.cloud.gateway: INFO
